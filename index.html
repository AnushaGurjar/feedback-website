<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #FBF6EC;
      color: #46290F;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 650px;
    }

    .card {
      background: #F2EADA;
      border: 2px solid #6B4226;
      border-radius: 22px;
      padding: 35px;
      box-shadow: 0 10px 30px rgba(70, 41, 15, 0.12);
    }

    .top-line {
      width: 70px;
      height: 5px;
      background: #E1592F;
      border-radius: 10px;
      margin-bottom: 22px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 30px;
      opacity: 0.85;
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 16px;
    }

    .rating-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin: 20px 0;
      flex-wrap: wrap;
    }

    /* Forensic bullet rating buttons */
    .target-btn {
      border: 2px solid #6B4226;
      background: #FBF6EC;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0;
      transition: transform 0.2s ease,
                  border-color 0.2s ease,
                  background 0.2s ease;
    }

    .target-btn svg {
      width: 28px;
      height: 48px;
      display: block;
    }

    .target-btn:hover {
      transform: translateY(-3px) scale(1.03);
      border-color: #E1592F;
    }

    /* Selected targets */
    .target-btn.active {
      background: #FFF3E8;
      border-color: #E1592F;
      transform: scale(1.08);
      box-shadow: 0 4px 12px rgba(225, 89, 47, 0.20);
    }

    .rating-message {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      min-height: 28px;
      color: #E1592F;
      margin-bottom: 28px;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      resize: vertical;
      border: 2px solid #6B4226;
      border-radius: 14px;
      background: #FBF6EC;
      color: #46290F;
      padding: 15px;
      font-family: inherit;
      font-size: 15px;
      outline: none;
    }

    textarea:focus {
      border-color: #E1592F;
    }

    .counter {
      text-align: right;
      font-size: 12px;
      margin-top: 6px;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      border: 2px solid #6B4226;
      border-radius: 13px;
      background: #6B4226;
      color: #FBF6EC;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .submit-btn:hover {
      background: #E1592F;
      border-color: #E1592F;
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .success {
      display: none;
      text-align: center;
      padding: 30px 10px 10px;
    }

    .success-icon {
      font-size: 48px;
      margin-bottom: 15px;
      color: #E1592F;
    }

    .success h2 {
      margin-bottom: 10px;
    }

    .success p {
      line-height: 1.6;
    }

    @media (max-width: 520px) {
      .card {
        padding: 25px 20px;
      }

      h1 {
        font-size: 27px;
      }

      .target-btn {
        width: 58px;
        height: 58px;
      }

      .target-btn svg {
        width: 24px;
        height: 42px;
      }

      .rating-container {
        gap: 10px;
      }
    }
  </style>
</head>
