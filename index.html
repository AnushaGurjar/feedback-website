<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #FBF6EC;
      color: #46290F;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 650px;
    }

    .card {
      background: #F2EADA;
      border: 2px solid #6B4226;
      border-radius: 22px;
      padding: 35px;
      box-shadow: 0 10px 30px rgba(70, 41, 15, 0.12);
    }

    .top-line {
      width: 70px;
      height: 5px;
      background: #E1592F;
      border-radius: 10px;
      margin-bottom: 22px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 30px;
      opacity: 0.85;
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 16px;
    }

    .rating-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin: 20px 0;
      flex-wrap: wrap;
    }

    /* 🎯 Target buttons - Updated for SVG Bullet Icons */
    .target-btn {
      border: 2px solid #6B4226;
      background: #FBF6EC;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0;
      transition: transform 0.2s ease,
                  border-color 0.2s ease,
                  background 0.2s ease;
    }

    /* Custom SVG Bullet Color Handling */
    .bullet-svg {
      width: 24px;
      height: 42px;
      transition: all 0.2s ease;
    }

    .bullet-body {
      fill: #FBF6EC;
      stroke: #6B4226;
      stroke-width: 2;
      transition: fill 0.2s ease, stroke 0.2s ease;
    }

    .bullet-line {
      stroke: #6B4226;
      stroke-width: 1.5;
      stroke-dasharray: 2,2;
      transition: stroke 0.2s ease;
    }

    .target-btn:hover {
      transform: translateY(-3px) scale(1.03);
      border-color: #E1592F;
    }

    .target-btn:hover .bullet-body {
      stroke: #E1592F;
    }

    .target-btn:hover .bullet-line {
      stroke: #E1592F;
    }

    /* Selected targets */
    .target-btn.active {
      background: #FFF3E8;
      border-color: #E1592F;
      transform: scale(1.08);
      box-shadow: 0 4px 12px rgba(225, 89, 47, 0.20);
    }

    .target-btn.active .bullet-body {
      fill: #E1592F;
      stroke: #E1592F;
    }

    .target-btn.active .bullet-line {
      stroke: #FBF6EC;
    }

    .rating-message {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      min-height: 28px;
      color: #E1592F;
      margin-bottom: 28px;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      resize: vertical;
      border: 2px solid #6B4226;
      border-radius: 14px;
      background: #FBF6EC;
      color: #46290F;
      padding: 15px;
      font-family: inherit;
      font-size: 15px;
      outline: none;
    }

    textarea:focus {
      border-color: #E1592F;
    }

    .counter {
      text-align: right;
      font-size: 12px;
      margin-top: 6px;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      border: 2px solid #6B4226;
      border-radius: 13px;
      background: #6B4226;
      color: #FBF6EC;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .submit-btn:hover {
      background: #E1592F;
      border-color: #E1592F;
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .success {
      display: none;
      text-align: center;
      padding: 30px 10px 10px;
    }

    .success-icon {
      font-size: 48px;
      margin-bottom: 15px;
      color: #E1592F;
    }

    .success h2 {
      margin-bottom: 10px;
    }

    .success p {
      line-height: 1.6;
    }

    @media (max-width: 520px) {
      .card {
        padding: 25px 20px;
      }

      h1 {
        font-size: 27px;
      }

      .target-btn {
        width: 58px;
        height: 58px;
      }

      .bullet-svg {
        width: 20px;
        height: 36px;
      }

      .rating-container {
        gap: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card" id="feedbackCard">

      <div class="top-line"></div>

      <h1>Share Your Feedback</h1>

      <p class="subtitle">
        Your feedback helps us understand what went well and where we can improve.
      </p>

      <div class="section-title">
        How would you rate your experience?
      </div>

      <div class="rating-container">

        <button type="button" class="target-btn" data-rating="1" aria-label="1 out of 5">
          <svg class="bullet-svg" viewBox="0 0 24 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path class="bullet-body" d="M 4,20 C 4,10 12,2 12,2 C 12,2 20,10 20,20 L 20,44 C 20,45.5 18.5,46 12,46 C 5.5,46 4,45.5 4,44 Z"/>
            <line class="bullet-line" x1="8" y1="18" x2="8" y2="38"/>
            <line class="bullet-line" x1="12" y1="16" x2="12" y2="40"/>
            <line class="bullet-line" x1="16" y1="18" x2="16" y2="38"/>
          </svg>
        </button>

        <button type="button" class="target-btn" data-rating="2" aria-label="2 out of 5">
          <svg class="bullet-svg" viewBox="0 0 24 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path class="bullet-body" d="M 4,20 C 4,10 12,2 12,2 C 12,2 20,10 20,20 L 20,44 C 20,45.5 18.5,46 12,46 C 5.5,46 4,45.5 4,44 Z"/>
            <line class="bullet-line" x1="8" y1="18" x2="8" y2="38"/>
            <line class="bullet-line" x1="12" y1="16" x2="12" y2="40"/>
            <line class="bullet-line" x1="16" y1="18" x2="16" y2="38"/>
          </svg>
        </button>

        <button type="button" class="target-btn" data-rating="3" aria-label="3 out of 5">
          <svg class="bullet-svg" viewBox="0 0 24 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path class="bullet-body" d="M 4,20 C 4,10 12,2 12,2 C 12,2 20,10 20,20 L 20,44 C 20,45.5 18.5,46 12,46 C 5.5,46 4,45.5 4,44 Z"/>
            <line class="bullet-line" x1="8" y1="18" x2="8" y2="38"/>
            <line class="bullet-line" x1="12" y1="16" x2="12" y2="40"/>
            <line class="bullet-line" x1="16" y1="18" x2="16" y2="38"/>
          </svg>
        </button>

        <button type="button" class="target-btn" data-rating="4" aria-label="4 out of 5">
          <svg class="bullet-svg" viewBox="0 0 24 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path class="bullet-body" d="M 4,20 C 4,10 12,2 12,2 C 12,2 20,10 20,20 L 20,44 C 20,45.5 18.5,46 12,46 C 5.5,46 4,45.5 4,44 Z"/>
            <line class="bullet-line" x1="8" y1="18" x2="8" y2="38"/>
            <line class="bullet-line" x1="12" y1="16" x2="12" y2="40"/>
            <line class="bullet-line" x1="16" y1="18" x2="16" y2="38"/>
          </svg>
        </button>

        <button type="button" class="target-btn" data-rating="5" aria-label="5 out of 5">
          <svg class="bullet-svg" viewBox="0 0 24 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path class="bullet-body" d="M 4,20 C 4,10 12,2 12,2 C 12,2 20,10 20,20 L 20,44 C 20,45.5 18.5,46 12,46 C 5.5,46 4,45.5 4,44 Z"/>
            <line class="bullet-line" x1="8" y1="18" x2="8" y2="38"/>
            <line class="bullet-line" x1="12" y1="16" x2="12" y2="40"/>
            <line class="bullet-line" x1="16" y1="18" x2="16" y2="38"/>
          </svg>
        </button>

      </div>

      <div class="rating-message" id="ratingMessage">
        Please select a rating
      </div>

      <div class="section-title">
        Anything you'd like to add?
        <span style="font-weight: normal;">(Optional)</span>
      </div>

      <textarea
        id="description"
        maxlength="3000"
        placeholder="Write your feedback here..."
      ></textarea>

      <div class="counter">
        <span id="counter">0</span>/3000
      </div>

      <button type="button" class="submit-btn" id="submitBtn">
        Submit Feedback
      </button>

      <div class="success" id="successMessage">
        <div class="success-icon">✓</div>
        <h2>Thank You!</h2>
        <p>Your feedback has been submitted successfully.</p>
      </div>

    </div>

  </div>

  <script>

    // GOOGLE APPS SCRIPT BACKEND
    const ENDPOINT_URL =
      "https://script.google.com/macros/s/AKfycbz1R0DUGDwTjgDzCeYX1b3UgbGTMnSSLhKd3AUm4BYkFuFHPlOMvHR-2LlQ1u1KZ0eT/exec";


    const ratingButtons = document.querySelectorAll(".target-btn");
    const ratingMessage = document.getElementById("ratingMessage");
    const description = document.getElementById("description");
    const counter = document.getElementById("counter");
    const submitBtn = document.getElementById("submitBtn");

    let selectedRating = 0;

    const messages = {
      1: "Can improve",
      2: "Good",
      3: "Nice execution",
      4: "Great Efforts!",
      5: "Excellent!"
    };


    /* Rating selection */
    ratingButtons.forEach(button => {

      button.addEventListener("click", () => {

        selectedRating = Number(button.dataset.rating);

        ratingButtons.forEach(btn => {
          btn.classList.remove("active");
        });

        for (let i = 0; i < selectedRating; i++) {
          ratingButtons[i].classList.add("active");
        }

        ratingMessage.textContent = messages[selectedRating];

      });

    });


    /* Character counter */
    description.addEventListener("input", () => {
      counter.textContent = description.value.length;
    });


    /* Submit feedback */
    submitBtn.addEventListener("click", async () => {

      if (selectedRating === 0) {
        alert("Please select a rating first.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting...";

      const payload = {
        rating: selectedRating,
        message: messages[selectedRating],
        description: description.value.trim()
      };

      try {

        await fetch(ENDPOINT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(payload)
        });

        /* Hide form after successful submission */
        document.querySelector(".top-line").style.display = "none";
        document.querySelector("h1").style.display = "none";
        document.querySelector(".subtitle").style.display = "none";
        document.querySelector(".section-title").style.display = "none";
        document.querySelector(".rating-container").style.display = "none";
        ratingMessage.style.display = "none";
        description.style.display = "none";
        document.querySelector(".counter").style.display = "none";
        submitBtn.style.display = "none";

        document.getElementById("successMessage").style.display = "block";

      } catch (error) {

        console.error(error);

        alert("Something went wrong. Please try again.");

        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Feedback";

      }

    });

  </script>

</body>
</html>
